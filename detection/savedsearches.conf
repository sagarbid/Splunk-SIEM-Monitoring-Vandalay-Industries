# Splunk scheduled alerts for the four conditions described in README.md.
# Drop into $SPLUNK_HOME/etc/system/local/savedsearches.conf (or an app's
# local/ directory) and restart Splunk, or reload via Settings > Searches,
# Reports, and Alerts.

[Vandalay - DDoS Threshold]
search = index=apache_logs | timechart span=1m count by clientip | where count > 1000
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */1 * * * *
enableSched = 1
alert.severity = 5
alert.track = 1
action.email = 1

[Vandalay - Brute Force Detected]
search = index=windows EventCode=4625 | stats count by src_ip, user, ComputerName | where count > 20
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 4
alert.track = 1
action.email = 1

[Vandalay - Privilege Escalation Outside Business Hours]
search = index=windows EventCode=4672 | eval hour=strftime(_time,"%H") | where hour<7 OR hour>19
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert.severity = 4
alert.track = 1
action.email = 1

# Note: host_exposure is a placeholder field name — in a real deployment this
# would come from an asset-classification lookup (CMDB export, asset tags,
# etc.), not a literal Nessus field. Replace with your actual lookup/field.
[Vandalay - Vuln Scan Activity on Internet-Facing Host]
search = index=nessus severity=Critical host_exposure=internet-facing
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
alert.severity = 3
alert.track = 1
action.email = 1
